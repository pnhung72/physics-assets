<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Vật lí – Thầy Hùng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#eef3f5;--panel:#fff;--ink:#12222d;--mute:#5b6d79;--line:#d3dde3;--acc:#0a6c8b;--acc2:#d99a1e;--bad:#c2412d;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a21;--panel:#172630;--ink:#e6eef2;--mute:#9db0bb;--line:#2a3d49;--acc:#5ec0dc;--acc2:#f0b84a;--bad:#f07a68}}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.up{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.up ol{margin:0 0 12px;padding-left:1.3em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){.btn{color:#0f1a21}}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.5;cursor:wait}
input[type=file]{max-width:100%}
textarea{width:100%;min-height:70px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px monospace}
#msg{margin:14px 0;color:var(--mute)}
#msg.err{color:var(--bad);font-weight:600}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:20px}
nav.toc{position:sticky;top:12px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
nav.toc b{display:block;margin-bottom:6px}
nav.toc a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.92rem}
nav.toc a:hover{background:var(--bg)}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav.toc{position:static}}
.chap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.chap>h2{margin:0;padding:14px 16px;font-size:1.2rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.w{font-size:.8rem;font-weight:500;color:var(--mute)}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:1.2em;color:var(--acc)}
details[open]>summary::before{content:"–"}
.body{padding:0 16px 16px;overflow-x:auto}
.body ul,.body ol{padding-left:1.2em;margin:6px 0}
.body img{max-width:100%;height:auto}
.formulas{border-left:4px solid var(--acc2);background:var(--bg);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:10px}
.note{background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.ex{border:1px solid var(--line);border-radius:8px;margin:10px 0}
.ex>p{padding:10px 12px 0;margin:0}
.vid{position:relative;padding-top:56.25%;margin:10px 0;border-radius:8px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cap{color:var(--mute);font-size:.88rem}
.warn{border-left:4px solid var(--bad);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:18px}
.end{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ôn tập Vật lí trước khi kiểm tra</h1>
  <p class="sub">Tải ma trận đề lên, trang sẽ gom đúng nội dung cần ôn.</p>

  <div class="up">
    <ol>
      <li>Mở <a href="https://thayhungp.blogspot.com/p/he-thong-kiem-tra-truc-tuyen-div.html" target="_blank" rel="noopener">TestOnline</a>, chọn ma trận của bài kiểm tra, bấm <b>Tải ma trận (JSON)</b>.</li>
      <li>Quay lại đây, chọn file vừa tải về (hoặc dán nội dung vào ô bên dưới).</li>
    </ol>
    <div class="row">
      <input type="file" id="file" accept=".json,.txt,application/json" aria-label="Chọn file ma trận">
      <button class="btn alt" id="last" hidden>Dùng ma trận đã tải lần trước</button>
    </div>
    <textarea id="paste" placeholder="Hoặc dán nội dung ma trận (JSON) vào đây" aria-label="Dán nội dung ma trận"></textarea>
    <p><button class="btn" id="go">Tạo bài ôn</button></p>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="out"></div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyq99M8liZkOpFpfDHehz4j5sXCUrLcM_CkwYwMvBYLcfhnN8VvtTAYSG-A71GEN9Yh/exec';
var TEST_URL = 'https://thayhungp.blogspot.com/p/he-thong-kiem-tra-truc-tuyen-div.html';
var KEY = 'ontap_matran_v1';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function say(t, err) { var m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }

// Làm sạch HTML từ file bài giảng: bỏ script/iframe, thuộc tính on*, liên kết javascript:
function clean(h) {
  var t = document.createElement('template');
  t.innerHTML = String(h == null ? '' : h);
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(function (n) { n.remove(); });
  t.content.querySelectorAll('*').forEach(function (n) {
    [].slice.call(n.attributes).forEach(function (a) {
      var k = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
      if (k.indexOf('on') === 0 || ((k === 'href' || k === 'src') && /^(javascript|data):/.test(v))) n.removeAttribute(a.name);
    });
  });
  return t.innerHTML;
}

// ===== Đọc ma trận: tìm mã bài dạng lớp_chương_bài (ví dụ 11_2_8) =====
var MA = /^\s*(\d{2})_(\d{1,2})_(\d{1,3})\s*$/;
var SKIP = { id:1, ID:1, grade:1, chapter:1, lesson:1, lop:1, chuong:1, bai:1, year:1, stt:1, index:1, order:1 };
function tong(n) {
  if (typeof n === 'number') return n;
  if (typeof n === 'string') return /^\d{1,3}$/.test(n) ? Number(n) : 0;
  var t = 0, k;
  if (Array.isArray(n)) { n.forEach(function (x) { t += tong(x); }); return t; }
  if (n && typeof n === 'object') for (k in n) if (!SKIP[k]) t += tong(n[k]);
  return t;
}
function docMaTran(text) {
  var kq = {};
  function them(ma, t) {
    var m = MA.exec(ma); if (!m) return;
    var k = m[1] + '_' + Number(m[3]);
    if (!kq[k]) kq[k] = { lop: m[1], bai: Number(m[3]), tong: 0 };
    kq[k].tong += (t || 0);
  }
  function di(n) {
    if (Array.isArray(n)) { n.forEach(di); return; }
    if (!n || typeof n !== 'object') return;
    var k;
    for (k in n) if (typeof n[k] === 'string' && MA.test(n[k])) { them(n[k], tong(n)); return; }
    for (k in n) { if (MA.test(k)) them(k, tong(n[k])); else di(n[k]); }
  }
  try { di(JSON.parse(text)); } catch (e) {}
  if (!Object.keys(kq).length) { // dự phòng: quét mọi mã trong văn bản
    var re = /(\d{2})_(\d{1,2})_(\d{1,3})/g, mm;
    while ((mm = re.exec(text))) them(mm[0], 1);
  }
  var theoLop = {};
  Object.keys(kq).forEach(function (k) { var b = kq[k]; (theoLop[b.lop] = theoLop[b.lop] || []).push(b); });
  Object.keys(theoLop).forEach(function (lop) {
    var ds = theoLop[lop], max = 0;
    ds.forEach(function (b) { if (b.tong > max) max = b.tong; });
    ds.forEach(function (b) { b.p = max > 0 ? Math.max(1, Math.round(5 * b.tong / max)) : 3; delete b.tong; });
    ds.sort(function (a, b) { return a.bai - b.bai; });
  });
  return theoLop;
}

// ===== Điều khiển =====
try { if (localStorage.getItem(KEY)) $('last').hidden = false; } catch (e) {}
$('last').addEventListener('click', function () {
  try { chay(JSON.parse(localStorage.getItem(KEY))); } catch (e) { say('Không đọc được ma trận đã lưu. Hãy tải lại file.', true); }
});
$('file').addEventListener('change', function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () { $('paste').value = String(r.result).slice(0, 400000); say('Đã nhận file "' + f.name + '". Bấm Tạo bài ôn.'); };
  r.readAsText(f, 'UTF-8');
});
$('go').addEventListener('click', function () {
  var txt = $('paste').value.trim();
  if (!txt) { say('Chưa có ma trận. Hãy chọn file hoặc dán nội dung.', true); return; }
  var tl = docMaTran(txt);
  if (!Object.keys(tl).length) { say('Không tìm thấy mã bài (dạng 11_2_8) trong ma trận. Hãy kiểm tra lại file đã tải.', true); return; }
  try { localStorage.setItem(KEY, JSON.stringify(tl)); $('last').hidden = false; } catch (e) {}
  chay(tl);
});

function chay(theoLop) {
  $('go').disabled = true; $('out').innerHTML = ''; say('Đang gom nội dung ôn tập…');
  var lops = Object.keys(theoLop).sort();
  Promise.all(lops.map(function (lop) {
    var q = theoLop[lop].map(function (b) { return b.bai + ':' + b.p; }).join(',');
    return fetch(API + '?action=onTapNoiDung&lop=' + lop + '&bai=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res.success) throw new Error(res.error || 'Không lấy được dữ liệu'); return res.data; });
  })).then(function (kq) { say(''); render(kq); })
    .catch(function (e) { say(e.message, true); })
    .then(function () { $('go').disabled = false; });
}

// ===== Hiển thị =====
function lst(arr, tag) {
  return '<' + tag + '>' + (arr || []).map(function (p) {
    if (p && typeof p === 'object') {
      var t = p.text || p.title || p.content || p.point || '';
      return '<li>' + clean(t) + (p.subpoints ? '<ul>' + p.subpoints.map(function (s) { return '<li>' + clean(s) + '</li>'; }).join('') + '</ul>' : '') + '</li>';
    }
    return '<li>' + clean(p) + '</li>';
  }).join('') + '</' + tag + '>';
}
function yt(url) {
  return /^https:\/\/www\.youtube(-nocookie)?\.com\/embed\/[\w-]{11}(\?[\w=&.-]*)?$/.test(String(url || ''))
    ? '<div class="vid"><iframe src="' + esc(url) + '" loading="lazy" allowfullscreen title="Video bài giảng"></iframe></div>' : '';
}
function dangHtml(d) {
  var m = d.methods || {}, s = '<details><summary>' + clean(d.title) + '</summary><div class="body">';
  if (m.heading) s += '<h4>' + clean(m.heading) + '</h4>';
  if (m.steps) s += '<b>Các bước giải</b>' + lst(m.steps, 'ol');
  if (m.note) s += '<div class="note"><b>Lưu ý:</b> ' + clean(m.note) + '</div>';
  var g = d.graphImage;
  if (g && /^https:\/\//.test(String(g.url || ''))) s += '<p><img src="' + esc(g.url) + '" alt="' + esc(g.caption) + '"><br><span class="cap">' + clean(g.caption) + '</span></p>';
  (d.examples || []).forEach(function (ex, i) {
    s += '<div class="ex"><p><b>Bài mẫu ' + (i + 1) + '.</b> ' + clean(ex.problem) + '</p><details><summary>Xem lời giải</summary><div class="body">' +
      (ex.solution || []).map(function (x) { return '<p>' + clean(x) + '</p>'; }).join('') + '</div></details></div>';
  });
  if (d.video) s += yt(d.video.url) + (d.video.caption ? '<div class="cap">' + clean(d.video.caption) + '</div>' : '');
  return s + '</div></details>';
}
function nhomHtml(lop, g, i) {
  var nd = g.noiDung, id = 'g' + lop + '_' + i;
  var s = '<section class="chap" id="' + id + '"><h2><span>' + esc(g.label) + '</span><span class="w">Lớp ' + lop + ' · Bài ' + g.bai.join(', ') + ' · Ưu tiên ' + g.trongSo + '/5</span></h2>';
  if (!nd) return s + '<div class="body"><p>Chưa đọc được nội dung bài này.</p></div></section>';
  if (nd.header && nd.header.description) s += '<div class="body"><div class="note">' + clean(nd.header.description) + '</div></div>';
  if (nd.video && nd.video.youtubeId && /^[\w-]{11}$/.test(nd.video.youtubeId) && !/VIDEO|^MA_|XXXX/i.test(nd.video.youtubeId)) {
    s += '<details><summary>Video tổng hợp</summary><div class="body">' + yt('https://www.youtube.com/embed/' + nd.video.youtubeId) +
      (nd.video.caption ? '<div class="cap">' + clean(nd.video.caption) + '</div>' : '') + '</div></details>';
  }
  var th = nd.theory;
  if (th && th.content) {
    s += '<details open><summary>' + clean(th.title || 'Ôn tập lí thuyết') + '</summary><div class="body">' +
      (th.content.heading ? '<h4>' + clean(th.content.heading) + '</h4>' : '') + lst(th.content.points, 'ul') +
      (th.content.formulas ? '<div class="formulas"><b>Công thức cần nhớ:</b> ' + clean(Array.isArray(th.content.formulas) ? th.content.formulas.join('<br>') : th.content.formulas) + '</div>' : '') +
      '</div></details>';
  }
  if ((nd.problemTypes || []).length) {
    s += '<details open><summary>Các dạng bài và phương pháp giải</summary><div class="body">' + nd.problemTypes.map(dangHtml).join('') + '</div></details>';
  }
  return s + '</section>';
}
function render(kq) {
  var toc = '', main = '', thieu = '';
  kq.forEach(function (d) {
    d.nhom.forEach(function (g, i) {
      toc += '<a href="#g' + d.lop + '_' + i + '">' + esc(g.label) + '</a>';
      main += nhomHtml(d.lop, g, i);
    });
    if (d.thieu.length) thieu += '<div class="warn">Lớp ' + d.lop + ': bài ' + d.thieu.map(function (b) { return b.bai; }).join(', ') + ' chưa có nội dung ôn trên hệ thống.</div>';
  });
  if (!main) { say('Ma trận có bài nhưng chưa có nội dung ôn tương ứng.', true); $('out').innerHTML = thieu; return; }
  $('out').innerHTML = '<div class="layout"><nav class="toc" aria-label="Mục lục"><b>Nội dung ôn</b>' + toc + '<a href="#end">Kiểm tra</a></nav><div>' + thieu + main +
    '<div class="end" id="end"><h2 style="margin-top:0">Ôn xong thì làm bài kiểm tra</h2><p><a class="btn" target="_blank" rel="noopener" href="' + TEST_URL + '">Mở TestOnline</a></p></div></div></div>';
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([$('out')]);
}
</script>
</body>
</html>
